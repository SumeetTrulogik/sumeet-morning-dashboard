<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Morning Briefing</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #21253a;
      --border:     #2a2d3a;
      --accent:     #6c8cf5;
      --accent-dim: #2a3560;
      --text:       #e2e4f0;
      --muted:      #6b7094;
      --red:        #ef4444;
      --orange:     #f97316;
      --yellow:     #d4a017;
      --green:      #22c55e;
      --success:    #4caf8a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 72px;
      gap: 24px;
    }

    .inner { width: 100%; max-width: 680px; }

    /* ── Top bar ─────────────────────────────── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      max-width: 680px;
    }

    .greeting {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .date-line {
      font-size: 1.55rem;
      font-weight: 300;
      letter-spacing: -0.02em;
    }
    .date-line strong { font-weight: 600; }

    /* ── Quote ───────────────────────────────── */
    .quote-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .quote-card blockquote {
      font-size: 0.93rem;
      font-style: italic;
      line-height: 1.6;
    }
    .quote-card cite {
      display: block;
      margin-top: 8px;
      font-size: 0.73rem;
      color: var(--muted);
      font-style: normal;
    }

    /* ── Section headers ─────────────────────── */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .task-count { font-size: 0.7rem; color: var(--muted); }

    /* ── Add task form ────────────────────────── */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .field { display: flex; flex-direction: column; gap: 5px; flex: 1; }

    .field label {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
      padding: 7px 11px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--muted); }
    .input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.4); cursor: pointer; }

    /* Criticality slider */
    .crit-wrap { display: flex; align-items: center; gap: 8px; }

    .crit-badge-sm {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .btn-add {
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 0.83rem;
      font-family: inherit;
      font-weight: 600;
      padding: 7px 18px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .btn-add:hover { background: var(--accent); color: #fff; }

    /* ── Filters ─────────────────────────────── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.7rem;
      font-family: inherit;
      padding: 4px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Task list ───────────────────────────── */
    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.25s;
    }
    .task-item.done { opacity: 0.4; }

    .crit-badge {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .task-body { flex: 1; min-width: 0; }

    .task-desc {
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .task-item.done .task-desc { text-decoration: line-through; color: var(--muted); }

    .task-meta { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
    .task-meta .overdue { color: var(--red); font-weight: 600; }

    .task-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .btn-icon {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1;
      transition: color 0.2s;
    }
    .btn-icon:hover       { color: var(--text); }
    .btn-icon.check:hover { color: var(--success); }
    .btn-icon.del:hover   { color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 28px;
      color: var(--muted);
      font-size: 0.83rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    /* ── Notes ───────────────────────────────── */
    .notes-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .notes-area {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.88rem;
      font-family: inherit;
      line-height: 1.65;
      resize: none;
      outline: none;
      min-height: 90px;
    }
    .notes-area::placeholder { color: var(--muted); }
    .save-hint {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: right;
      margin-top: 6px;
      height: 13px;
      transition: color 0.3s;
    }
    .save-hint.saved { color: var(--success); }
  </style>
</head>
<body>

<div id="app">

  <!-- Top bar -->
  <div class="topbar">
    <div>
      <p class="greeting" id="greeting"></p>
      <p class="date-line" id="dateDisplay"></p>
    </div>
  </div>

  <!-- Quote -->
  <div class="quote-card inner">
    <blockquote id="quoteText"></blockquote>
    <cite id="quoteAuthor"></cite>
  </div>

  <!-- Tasks -->
  <div class="inner">
    <div class="section-header">
      <span class="section-label">Tasks</span>
      <span class="task-count" id="taskCount"></span>
    </div>

    <div class="add-form">
      <div class="field">
        <label>Description</label>
        <input class="input" id="taskDesc" type="text" placeholder="What needs to get done?" />
      </div>
      <div class="form-row">
        <div class="field" style="min-width:160px;">
          <label>Criticality &nbsp;<span id="critLabel" style="color:var(--text);font-weight:600;">5</span>/10</label>
          <div class="crit-wrap">
            <div class="crit-badge-sm" id="critPreview">5</div>
            <input type="range" id="critSlider" min="1" max="10" value="5" />
          </div>
        </div>
        <div class="field">
          <label>Target date</label>
          <input class="input" id="taskDate" type="date" />
        </div>
        <button class="btn-add" id="addTaskBtn">+ Add</button>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
      <button class="filter-btn" data-filter="overdue">Overdue</button>
    </div>

    <div class="task-list" id="taskList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

  <!-- Notes -->
  <div class="notes-wrap inner">
    <div class="section-header" style="margin-bottom:10px;">
      <span class="section-label">Notes</span>
      <span class="save-hint" id="saveHint"></span>
    </div>
    <textarea class="notes-area" id="notes" rows="5" placeholder="Thoughts, reminders, ideas for today…"></textarea>
  </div>

</div>

<script>
  // ── Firebase ────────────────────────────────────────────────
  firebase.initializeApp({
    apiKey:            "AIzaSyC3RLr1sHybmwL5NCUgP66uAJd_S_gMgpA",
    authDomain:        "sumeet-dashboard-eae49.firebaseapp.com",
    projectId:         "sumeet-dashboard-eae49",
    storageBucket:     "sumeet-dashboard-eae49.firebasestorage.app",
    messagingSenderId: "319906200788",
    appId:             "1:319906200788:web:901fb5651331b1be2f0f41"
  });
  const db = firebase.firestore();

  // Fixed paths — no auth needed
  const TASKS_REF = db.collection('dashboard').doc('main').collection('tasks');
  const notesDocRef = () => {
    const d = new Date();
    return db.collection('dashboard').doc('main')
             .collection('notes')
             .doc(`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`);
  };

  // ── Date & greeting ─────────────────────────────────────────
  const now = new Date();
  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MON_NAMES = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
  document.getElementById('dateDisplay').innerHTML =
    `${DAY_NAMES[now.getDay()]}, ${MON_NAMES[now.getMonth()]} <strong>${now.getDate()}</strong> &mdash; ${now.getFullYear()}`;
  const h = now.getHours();
  document.getElementById('greeting').textContent =
    h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';

  // ── Daily quote ─────────────────────────────────────────────
  const QUOTES = [
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "Do the hard jobs first. The easy jobs will take care of themselves.", author: "Dale Carnegie" },
    { text: "It is not the mountain we conquer but ourselves.", author: "Edmund Hillary" },
    { text: "Focus on being productive instead of busy.", author: "Tim Ferriss" },
    { text: "Your time is limited, so don't waste it living someone else's life.", author: "Steve Jobs" },
    { text: "The way to get started is to quit talking and begin doing.", author: "Walt Disney" },
    { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
    { text: "You don't have to be great to start, but you have to start to be great.", author: "Zig Ziglar" },
    { text: "Energy and persistence conquer all things.", author: "Benjamin Franklin" },
    { text: "Opportunities don't happen. You create them.", author: "Chris Grosser" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
    { text: "What you do today can improve all your tomorrows.", author: "Ralph Marston" },
    { text: "The future depends on what you do today.", author: "Mahatma Gandhi" },
    { text: "Hard work beats talent when talent doesn't work hard.", author: "Tim Notke" },
    { text: "Discipline is choosing between what you want now and what you want most.", author: "Abraham Lincoln" },
    { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis" },
    { text: "With the new day comes new strength and new thoughts.", author: "Eleanor Roosevelt" },
    { text: "Don't count the days, make the days count.", author: "Muhammad Ali" },
    { text: "The harder the conflict, the greater the triumph.", author: "George Washington" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Push yourself, because no one else is going to do it for you.", author: "Unknown" },
    { text: "Great things never come from comfort zones.", author: "Unknown" },
    { text: "Dream it. Wish it. Do it.", author: "Unknown" },
    { text: "Don't stop when you're tired. Stop when you're done.", author: "Unknown" },
    { text: "Wake up with determination. Go to bed with satisfaction.", author: "Unknown" },
    { text: "The key to success is to focus on goals, not obstacles.", author: "Unknown" },
    { text: "Strive for progress, not perfection.", author: "Unknown" },
    { text: "Small steps every day.", author: "Unknown" },
    { text: "You are stronger than you think.", author: "Unknown" },
    { text: "Make each day your masterpiece.", author: "John Wooden" },
  ];
  const startOfYear = new Date(now.getFullYear(), 0, 0);
  const dayOfYear   = Math.floor((now - startOfYear) / 86400000);
  const q = QUOTES[dayOfYear % QUOTES.length];
  document.getElementById('quoteText').textContent   = `"${q.text}"`;
  document.getElementById('quoteAuthor').textContent = `— ${q.author}`;

  // ── Criticality helpers ─────────────────────────────────────
  function critColor(n) {
    if (n >= 9) return '#ef4444';
    if (n >= 7) return '#f97316';
    if (n >= 4) return '#d4a017';
    return '#22c55e';
  }
  function critBg(n) {
    if (n >= 9) return '#3a1010';
    if (n >= 7) return '#3a1f0a';
    if (n >= 4) return '#3a2e0a';
    return '#0a2e18';
  }

  // ── Slider ──────────────────────────────────────────────────
  const slider      = document.getElementById('critSlider');
  const critPreview = document.getElementById('critPreview');
  const critLabel   = document.getElementById('critLabel');

  function updateSlider() {
    const v = parseInt(slider.value);
    critLabel.textContent        = v;
    critPreview.textContent      = v;
    critPreview.style.background = critBg(v);
    critPreview.style.color      = critColor(v);
  }
  slider.addEventListener('input', updateSlider);
  updateSlider();

  // ── Tasks ───────────────────────────────────────────────────
  let allTasks     = [];
  let activeFilter = 'all';

  TASKS_REF.orderBy('createdAt', 'desc')
    .onSnapshot(
      snap => {
        allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.criticality || 0) - (a.criticality || 0));
        renderTasks();
      },
      err => showError('Failed to load tasks: ' + err.message)
    );

  document.getElementById('addTaskBtn').addEventListener('click', addTask);
  document.getElementById('taskDesc').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  async function addTask() {
    const desc = document.getElementById('taskDesc').value.trim();
    if (!desc) return;
    try {
      await TASKS_REF.add({
        description: desc,
        criticality: parseInt(slider.value),
        targetDate:  document.getElementById('taskDate').value || null,
        done:        false,
        createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
      });
      document.getElementById('taskDesc').value = '';
      document.getElementById('taskDate').value = '';
      slider.value = 5;
      updateSlider();
    } catch(err) {
      showError('Failed to add task: ' + err.message);
    }
  }

  function showError(msg) {
    let el = document.getElementById('errorBanner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'errorBanner';
      el.style.cssText = 'background:#3a1010;border:1px solid #ef4444;color:#ef4444;padding:10px 16px;border-radius:8px;font-size:0.82rem;margin-bottom:8px;';
      document.getElementById('taskList').before(el);
    }
    el.textContent = msg;
  }

  async function toggleDone(id, current) {
    await TASKS_REF.doc(id).update({ done: !current });
  }

  async function deleteTask(id) {
    await TASKS_REF.doc(id).delete();
  }

  // ── Filters ─────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderTasks();
    });
  });

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function filterTasks(tasks) {
    const today = todayStr();
    if (activeFilter === 'active')  return tasks.filter(t => !t.done);
    if (activeFilter === 'done')    return tasks.filter(t => t.done);
    if (activeFilter === 'overdue') return tasks.filter(t => !t.done && t.targetDate && t.targetDate < today);
    return tasks;
  }

  // ── Render ──────────────────────────────────────────────────
  function renderTasks() {
    const list    = document.getElementById('taskList');
    const visible = filterTasks(allTasks);
    const active  = allTasks.filter(t => !t.done).length;
    document.getElementById('taskCount').textContent =
      `${active} active / ${allTasks.length} total`;

    if (visible.length === 0) {
      list.innerHTML = `<div class="empty-state">${
        activeFilter === 'all'     ? 'No tasks yet — add one above' :
        activeFilter === 'overdue' ? 'No overdue tasks' :
        `No ${activeFilter} tasks`
      }</div>`;
      return;
    }

    const today = todayStr();
    list.innerHTML = '';
    visible.forEach(task => {
      const overdue = !task.done && task.targetDate && task.targetDate < today;
      const c = task.criticality || 5;
      const el = document.createElement('div');
      el.className = `task-item${task.done ? ' done' : ''}`;
      el.innerHTML = `
        <div class="crit-badge" style="background:${critBg(c)};color:${critColor(c)}">${c}</div>
        <div class="task-body">
          <div class="task-desc">${escHtml(task.description)}</div>
          ${task.targetDate ? `<div class="task-meta">${formatDate(task.targetDate, overdue)}</div>` : ''}
        </div>
        <div class="task-actions">
          <button class="btn-icon check" title="${task.done ? 'Mark active' : 'Mark done'}">${task.done ? '↩' : '✓'}</button>
          <button class="btn-icon del" title="Delete">✕</button>
        </div>`;
      el.querySelector('.check').addEventListener('click', () => toggleDone(task.id, task.done));
      el.querySelector('.del').addEventListener('click',   () => deleteTask(task.id));
      list.appendChild(el);
    });
  }

  function formatDate(iso, overdue) {
    const [y, m, d] = iso.split('-').map(Number);
    const label = new Date(y, m-1, d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    return overdue
      ? `<span class="overdue">⚠ Overdue · ${label}</span>`
      : `Due ${label}`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Notes ───────────────────────────────────────────────────
  let notesSaveTimer;

  notesDocRef().onSnapshot(doc => {
    const area = document.getElementById('notes');
    if (doc.exists && document.activeElement !== area) {
      area.value = doc.data().content || '';
    }
  });

  document.getElementById('notes').addEventListener('input', () => {
    clearTimeout(notesSaveTimer);
    notesSaveTimer = setTimeout(async () => {
      await notesDocRef().set({ content: document.getElementById('notes').value });
      const hint = document.getElementById('saveHint');
      hint.textContent = 'Saved ✓';
      hint.classList.add('saved');
      setTimeout(() => { hint.textContent = ''; hint.classList.remove('saved'); }, 1800);
    }, 800);
  });
</script>
</body>
</html>
